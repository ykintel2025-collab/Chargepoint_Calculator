<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChargePoint Sales Pro | Analyst</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --cp-magenta: #e6007e; --cp-dark: #333333; --cp-border: #e0e0e0; }
        body { font-family: 'Inter', sans-serif; background: #f4f7f9; margin: 0; padding: 20px; color: var(--cp-dark); }
        .wrapper { max-width: 850px; margin: 0 auto; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
        .header { padding: 25px 40px; border-bottom: 2px solid var(--cp-magenta); display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .logo { max-height: 50px; width: auto; }
        .content { padding: 40px; }
        h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--cp-magenta); margin: 30px 0 20px 0; border-bottom: 1px solid #eee; padding-bottom: 10px; font-weight: 700; }
        .input-group { margin-bottom: 25px; }
        label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; color: #666; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--cp-border); border-radius: 4px; font-size: 15px; box-sizing: border-box; }
        .address-row { display: flex; gap: 10px; align-items: flex-end; }
        .btn-api { background: var(--cp-dark); color: white; border: none; padding: 13px 20px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; }
        .btn-main { background: var(--cp-magenta); color: white; border: none; padding: 20px; width: 100%; font-size: 16px; font-weight: 700; text-transform: uppercase; cursor: pointer; margin-top: 20px; }
        #solar-results { display: none; margin-top: 20px; padding: 20px; background: #fff4f9; border: 1px solid var(--cp-magenta); border-radius: 4px; }
        #result-box { display: none; margin-top: 30px; padding: 35px; background: var(--cp-dark); color: white; border-radius: 6px; }
        .highlight { color: var(--cp-magenta); font-size: 36px; font-weight: 800; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <img src="Chargepoint_logo.png" alt="ChargePoint" class="logo">
        <div style="font-weight:800; color:var(--cp-magenta); font-size: 12px;">SALES PRO ANALYST</div>
    </div>

    <div class="content">
        <h2>1. Locatie & Dak Analyse</h2>
        <div class="input-group">
            <div class="address-row">
                <div style="flex-grow: 1;">
                    <label>Adres voor Satellietscan</label>
                    <input type="text" id="adres" placeholder="Straat, Nr, Woonplaats" value="Lingestraat 21 Veghel">
                </div>
                <button class="btn-api" onclick="scanDak()">Scan Dak via Google</button>
            </div>
        </div>

        <div id="solar-results">
            <div id="dak_info" style="line-height: 1.6; font-size: 14px;"></div>
        </div>

        <h2>2. Energie Profiel</h2>
        <div class="grid">
            <div class="input-group">
                <label>Jaarverbruik (kWh)</label>
                <input type="number" id="usage" value="3800">
            </div>
            <div class="input-group">
                <label>Extra Verbruikers</label>
                <div style="font-size: 13px; display: flex; gap: 15px; margin-top: 10px;">
                    <label style="text-transform:none; color:inherit; display:flex; align-items:center; gap:5px;"><input type="checkbox" id="ev"> EV</label>
                    <label style="text-transform:none; color:inherit; display:flex; align-items:center; gap:5px;"><input type="checkbox" id="wp"> Warmtepomp</label>
                </div>
            </div>
        </div>

        <button class="btn-main" onclick="bereken()">Genereer Systeem Advies</button>

        <div id="result-box">
            <div style="text-transform:uppercase; font-size:11px; letter-spacing: 2px; color:var(--cp-magenta); font-weight:700;">Geadviseerde Configuratie</div>
            <div class="grid">
                <div>
                    <label style="color:#aaa;">Opslagcapaciteit</label>
                    <div class="highlight" id="out_bat">-- kWh</div>
                </div>
                <div>
                    <label style="color:#aaa;">PV Potentieel</label>
                    <div class="highlight" id="out_pv">-- kWp</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const KEY = 'AIzaSyAHsZid6T-w8cpmOl3jd_iCgahc5H_PkR8'; 
    let maxKWp = 0;

    async function scanDak() {
        const adres = document.getElementById('adres').value;
        const infoDiv = document.getElementById('dak_info');
        document.getElementById('solar-results').style.display = 'block';
        infoDiv.innerText = "Bezig met scannen...";

        try {
            const gRes = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(adres)}&key=${KEY}`);
            const gData = await gRes.json();
            
            if (gData.status !== "OK") throw new Error("Adres niet gevonden.");
            
            const loc = gData.results[0].geometry.location;
            const sRes = await fetch(`https://solar.googleapis.com/v1/buildingInsights:findClosest?location.latitude=${loc.lat}&location.longitude=${loc.lng}&key=${KEY}`);
            const sData = await sRes.json();

            if (!sData.solarPotential) {
                // SLIMME FALLBACK: Als Google geen data heeft, schatten we op basis van woningtype
                maxKWp = 6.5; 
                infoDiv.innerHTML = `<span style="color:#ff9800;">Google Solar data niet beschikbaar voor dit pand. Wij rekenen met een geschat dakpotentieel van <b>6.5 kWp</b>.</span>`;
            } else {
                const panelen = sData.solarPotential.maxArrayPanels;
                maxKWp = panelen * 0.43;
                infoDiv.innerHTML = `Analyse voltooid: <b>${panelen} panelen</b> mogelijk (ca. <b>${maxKWp.toFixed(1)} kWp</b>).`;
            }
        } catch (e) {
            // Als zelfs de Geocoding faalt, gebruiken we een veilige basiswaarde
            maxKWp = 5.0;
            infoDiv.innerHTML = `<span style="color:red;">Fout: Adresscan mislukt. Wij rekenen met een basispotentieel van 5.0 kWp.</span>`;
        }
    }

    function bereken() {
        const usage = parseFloat(document.getElementById('usage').value);
        const ev = document.getElementById('ev').checked;
        const wp = document.getElementById('wp').checked;
        
        let f = 0.65 + (ev ? 0.15 : 0) + (wp ? 0.20 : 0);
        let cap = (usage / 365) * f;
        
        let limitPV = maxKWp > 0 ? maxKWp : 5;
        cap = Math.min(cap, limitPV * 1.5);
        
        cap = Math.max(2.5, Math.round(cap / 2.5) * 2.5);
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('out_bat').innerText = cap.toFixed(1) + " kWh";
        document.getElementById('out_pv').innerText = maxKWp > 0 ? maxKWp.toFixed(1) + " kWp" : "5.0 kWp (schatting)";
    }
</script>

</body>
</html>
