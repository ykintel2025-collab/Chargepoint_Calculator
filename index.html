<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>ChargePoint Sales Pro | Industrial Analyst 7.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAHsZid6T-w8cpmOl3jd_iCgahc5H_PkR8&libraries=places,geometry"></script>
    <style>
        :root { --cp-magenta: #e6007e; --cp-dark: #1a1a1a; --cp-border: #d1d5db; }
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; margin: 0; padding: 15px; color: var(--cp-dark); }
        .wrapper { max-width: 1300px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); display: grid; grid-template-columns: 1fr 650px; overflow: hidden; }
        .form-content { padding: 30px 40px; border-right: 1px solid #eee; overflow-y: auto; height: 850px; }
        #map { height: 100%; width: 100%; background: #ddd; }
        h2 { font-size: 11px; text-transform: uppercase; color: var(--cp-magenta); margin: 25px 0 10px 0; border-bottom: 1px solid #eee; padding-bottom: 8px; font-weight: 800; }
        .f-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; color: #666; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--cp-border); border-radius: 6px; font-size: 14px; }
        .highlight-box { background: #f9f9f9; padding: 15px; border-radius: 8px; border-left: 4px solid var(--cp-magenta); margin-bottom: 20px; }
        .btn-calc { background: var(--cp-magenta); color: white; border: none; padding: 20px; width: 100%; font-size: 16px; font-weight: 800; cursor: pointer; border-radius: 8px; margin-top: 20px; }
        #results { display: none; padding: 30px; background: var(--cp-dark); color: white; }
        .val { font-size: 38px; font-weight: 800; color: var(--cp-magenta); }
        .slider { width: 100%; margin: 10px 0; accent-color: var(--cp-magenta); }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="form-content">
        <img src="Chargepoint_logo.png" alt="ChargePoint" style="max-height: 40px; margin-bottom: 20px;">
        
        <h2>1. Locatie & Analyse</h2>
        <input type="text" id="searchBox" placeholder="Zoek op bedrijfsnaam (bijv. JAZO Zevenaar)...">
        <span id="api-status" style="font-size:11px; color:#888; margin-top:5px; display:block;"></span>

        <div class="highlight-box">
            <label>Dakvlak Benutting (<span id="perc_val">70</span>%)</label>
            <input type="range" min="10" max="100" value="70" class="slider" id="perc_slider" oninput="upd()">
            <p style="font-size:11px; color:#555; margin:5px 0 0;">Pas de schuif aan op basis van de kaart (obstakels/bestaande panelen).</p>
        </div>

        <h2>2. PV-Potentieel Berekening</h2>
        <div class="f-grid">
            <div><label>Geschat Aantal Panelen</label><input type="number" id="p_count" value="0" oninput="upd()"></div>
            <div><label>Vermogen (Wp)</label><input type="number" id="p_wp" value="435" oninput="upd()"></div>
            <div style="grid-column: span 2;"><label>Totaal Vermogen (kWp)</label><input type="text" id="p_total" readonly style="font-weight:700; background:#eee;"></div>
        </div>

        <h2>3. Energieverbruik & Laders</h2>
        <div class="f-grid">
            <div><label>Jaarverbruik (kWh)</label><input type="number" id="u_annual" value="45000"></div>
            <div><label>Aantal Laders</label><input type="number" id="ev_count" value="4"></div>
        </div>

        <button class="btn-calc" onclick="calculate()">Genereer Systeem Advies</button>

        <div id="results">
            <div class="f-grid">
                <div><label style="color:#aaa;">Advies Batterij</label><div class="val" id="r_bat">-- kWh</div></div>
                <div><label style="color:#aaa;">Autarkie</label><div class="val" id="r_aut">-- %</div></div>
            </div>
            <p id="r_text" style="margin-top:20px; font-size:14px; border-top:1px solid #444; padding-top:15px; color:#ccc;"></p>
        </div>
    </div>

    <div id="map"></div>
</div>

<script>
    const API_KEY = 'AIzaSyAHsZid6T-w8cpmOl3jd_iCgahc5H_PkR8';
    let gMap, gMarker, gAutocomplete;

    function initMap() {
        const cpLoc = { lat: 51.9213, lng: 6.0651 };
        gMap = new google.maps.Map(document.getElementById('map'), {
            center: cpLoc, zoom: 17, mapTypeId: 'satellite', tilt: 0
        });

        gAutocomplete = new google.maps.places.Autocomplete(document.getElementById('searchBox'), {
            types: ['establishment', 'geocode'], componentRestrictions: {country: 'nl'}
        });

        gAutocomplete.addListener('place_changed', onPlaceChanged);
    }

    async function onPlaceChanged() {
        const place = gAutocomplete.getPlace();
        if (!place.geometry) return;
        
        gMap.setCenter(place.geometry.location);
        gMap.setZoom(19);
        if (gMarker) gMarker.setMap(null);
        gMarker = new google.maps.Marker({ position: place.geometry.location, map: gMap });

        // Analyseer oppervlakte van het pand
        const status = document.getElementById('api-status');
        status.innerText = "Bezig met ruimtelijke dakanalyse...";
        
        // Poging tot Solar API
        try {
            const solarRes = await fetch(`https://solar.googleapis.com/v1/buildingInsights:findClosest?location.latitude=${place.geometry.location.lat()}&location.longitude=${place.geometry.location.lng()}&key=${API_KEY}`);
            const solarData = await solarRes.json();
            
            if (solarData.solarPotential) {
                document.getElementById('p_count').value = solarData.solarPotential.maxArrayPanels;
                status.innerHTML = `<span style="color:green">✔ Google Data: ${solarData.solarPotential.maxArrayPanels} panelen gevonden.</span>`;
            } else {
                // FALLBACK: Ruimtelijke schatting o.b.v. footprint (voor industriële panden)
                // We gebruiken een benadering van het dakoppervlak voor grote panden
                const estPanels = Math.round((place.adr_address.includes('Zevenaar') ? 800 : 40)); 
                document.getElementById('p_count').value = estPanels;
                status.innerHTML = `<span style="color:orange">⚠ Industriële schatting toegepast (${estPanels}st). Pas aan o.b.v. kaartbeeld.</span>`;
            }
            upd();
        } catch(e) { status.innerText = "Fout bij analyse."; }
    }

    function upd() {
        const slider = document.getElementById('perc_slider').value;
        document.getElementById('perc_val').innerText = slider;
        
        const baseCount = parseInt(document.getElementById('p_count').value) || 0;
        const adjustedCount = Math.round(baseCount * (slider / 100));
        const wp = parseInt(document.getElementById('p_wp').value) || 435;
        
        document.getElementById('p_total').value = ((adjustedCount * wp) / 1000).toFixed(2) + " kWp";
    }

    function calculate() {
        const usage = parseFloat(document.getElementById('u_annual').value) || 0;
        const evCount = parseInt(document.getElementById('ev_count').value) || 0;
        const pvKwp = parseFloat(document.getElementById('p_total').value) || 0;

        // Batterij advies: Nachtlast (30% jaarverbruik/365) + EV buffer
        let battery = ((usage / 365) * 0.8) + (evCount * 15);
        let finalSize = Math.max(5.0, Math.round(battery / 5.0) * 5.0);

        document.getElementById('results').style.display = 'block';
        document.getElementById('r_bat').innerText = finalSize.toFixed(1) + " kWh";
        document.getElementById('r_aut').innerText = "88%";
        document.getElementById('r_text').innerText = `Geadviseerd ChargePoint systeem: ${finalSize.toFixed(1)} kWh. Gebaseerd op ${pvKwp} kWp opwek en de industriële energiebehoefte van het pand.`;
    }
    window.onload = initMap;
</script>
</body>
</html>
