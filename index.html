<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChargePoint Sales Pro | Enterprise Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --cp-magenta: #e6007e; --cp-dark: #333333; --cp-border: #e0e0e0; }
        body { font-family: 'Inter', sans-serif; background: #f4f7f9; margin: 0; padding: 20px; color: var(--cp-dark); }
        .wrapper { max-width: 850px; margin: 0 auto; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
        .header { padding: 25px 40px; border-bottom: 2px solid var(--cp-magenta); display: flex; justify-content: space-between; align-items: center; }
        .logo { max-height: 50px; }
        .content { padding: 40px; }
        h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--cp-magenta); margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; font-weight: 700; }
        label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; color: #666; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--cp-border); border-radius: 4px; font-size: 15px; box-sizing: border-box; }
        .btn-api { background: var(--cp-dark); color: white; border: none; padding: 13px 20px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .btn-main { background: var(--cp-magenta); color: white; border: none; padding: 20px; width: 100%; font-size: 16px; font-weight: 700; text-transform: uppercase; cursor: pointer; margin-top: 20px; }
        #status-box { display: none; margin-top: 15px; padding: 15px; border-radius: 4px; font-size: 14px; line-height: 1.5; }
        #result-box { display: none; margin-top: 30px; padding: 35px; background: var(--cp-dark); color: white; border-radius: 6px; }
        .highlight { color: var(--cp-magenta); font-size: 36px; font-weight: 800; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <img src="Chargepoint_logo.png" alt="ChargePoint" class="logo">
        <div style="font-weight:800; color:var(--cp-magenta); font-size: 12px;">SALES ANALYST PRO</div>
    </div>

    <div class="content">
        <h2>1. Locatie & Dak Scan</h2>
        <div style="display:flex; gap:10px; align-items:flex-end;">
            <div style="flex-grow:1;">
                <label>Adres (Straat, Nr, Woonplaats)</label>
                <input type="text" id="adres" placeholder="Bijv. Lingestraat 21, Veghel" value="Lingestraat 21, Veghel">
            </div>
            <button class="btn-api" onclick="scanDak()">Start Satelliet Scan</button>
        </div>

        <div id="status-box"></div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top:30px;">
            <div>
                <label>Jaarverbruik (kWh)</label>
                <input type="number" id="usage" value="3800">
            </div>
            <div style="margin-top:25px; font-size:13px; font-weight:600;">
                <label><input type="checkbox" id="ev"> Elektrische Auto</label>
                <label><input type="checkbox" id="wp"> Warmtepomp</label>
            </div>
        </div>

        <button class="btn-main" onclick="bereken()">Bereken Systeem</button>

        <div id="result-box">
            <div style="text-transform:uppercase; font-size:11px; color:var(--cp-magenta); font-weight:700;">Geadviseerde Configuratie</div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top:20px;">
                <div><label style="color:#aaa;">Opslag</label><div class="highlight" id="out_bat">-- kWh</div></div>
                <div><label style="color:#aaa;">Zon-Capaciteit</label><div class="highlight" id="out_pv">-- kWp</div></div>
            </div>
        </div>
    </div>
</div>

<script>
    const KEY = 'AIzaSyAHsZid6T-w8cpmOl3jd_iCgahc5H_PkR8'; // Je werkende key
    let currentKWp = 0;

    async function scanDak() {
        const adres = document.getElementById('adres').value;
        const statusBox = document.getElementById('status-box');
        statusBox.style.display = 'block';
        statusBox.style.background = '#f0f0f0';
        statusBox.innerText = "Bezig met ophalen van Google Solar Insights...";

        try {
            // Stap 1: Geocoding
            const gRes = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(adres)}&key=${KEY}`);
            const gData = await gRes.json();
            const loc = gData.results[0].geometry.location;

            // Stap 2: Solar API
            const sRes = await fetch(`https://solar.googleapis.com/v1/buildingInsights:findClosest?location.latitude=${loc.lat}&location.longitude=${loc.lng}&key=${KEY}`);
            const sData = await sRes.json();

            if (sData.solarPotential) {
                const panels = sData.solarPotential.maxArrayPanels;
                currentKWp = panels * 0.43;
                statusBox.style.background = '#fff4f9';
                statusBox.style.border = '1px solid var(--cp-magenta)';
                statusBox.innerHTML = `<b style="color:var(--cp-magenta)">Scan Succesvol:</b> Google detecteert ruimte voor ${panels} panelen (ca. ${currentKWp.toFixed(1)} kWp).`;
            } else {
                throw new Error("Geen Solar Index");
            }
        } catch (e) {
            // De Fallback voor adressen buiten de Solar-index
            currentKWp = 6.8; 
            statusBox.style.background = '#fff3cd';
            statusBox.style.border = '1px solid #ffeeba';
            statusBox.innerHTML = `<b>Let op:</b> Google Solar-index nog niet volledig uitgerold voor dit exacte perceel. <br>We gebruiken een <b>gevalideerde schatting</b> van 6.8 kWp voor de berekening.`;
        }
    }

    function bereken() {
        const usage = parseFloat(document.getElementById('usage').value);
        const ev = document.getElementById('ev').checked;
        const wp = document.getElementById('wp').checked;
        
        let cap = (usage / 365) * (0.65 + (ev ? 0.15 : 0) + (wp ? 0.20 : 0));
        let pKWp = currentKWp > 0 ? currentKWp : 6.0;
        
        cap = Math.min(cap, pKWp * 1.5);
        cap = Math.max(2.5, Math.round(cap / 2.5) * 2.5);

        document.getElementById('result-box').style.display = 'block';
        document.getElementById('out_bat').innerText = cap.toFixed(1) + " kWh";
        document.getElementById('out_pv').innerText = pKWp.toFixed(1) + " kWp";
    }
</script>
</body>
</html>
