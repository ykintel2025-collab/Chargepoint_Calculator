<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>ChargePoint Infra Analyst 5.3</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAHsZid6T-w8cpmOl3jd_iCgahc5H_PkR8&libraries=places"></script>
    <style>
        :root { --cp-magenta: #e6007e; --cp-dark: #1a1a1a; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 20px; background: #f8f9fa; }
        .wrapper { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 500px; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .sidebar { padding: 30px; border-right: 1px solid #eee; }
        #map { height: 700px; width: 100%; background: #eee; }
        label { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; color: #666; margin: 15px 0 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; }
        .btn { background: var(--cp-magenta); color: white; border: none; padding: 18px; width: 100%; font-weight: 800; cursor: pointer; border-radius: 6px; margin-top: 20px; }
        #api-status { font-size: 12px; font-weight: 700; margin-top: 10px; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="sidebar">
        <label>Project Locatie (Typ adres)</label>
        <input type="text" id="searchBox" placeholder="Bijv. Lingestraat 21, Veghel">
        <div id="api-status"></div>

        <label>Aantal Panelen (Google Data)</label>
        <input type="number" id="p_count" value="0">
        
        <label>Gebouwverbruik (kWh/jaar)</label>
        <input type="number" id="u_annual" value="4500">

        <button class="btn" onclick="calculate()">Bereken Systeem</button>

        <div id="results" style="display:none; margin-top:30px; padding:20px; background:var(--cp-dark); color:white; border-radius:8px;">
            <div style="font-size:32px; font-weight:800; color:var(--cp-magenta);" id="r_bat">-- kWh</div>
            <p id="r_text" style="font-size:14px; color:#ccc; margin-top:10px;"></p>
        </div>
    </div>
    <div id="map"></div>
</div>

<script>
    const API_KEY = 'AIzaSyAHsZid6T-w8cpmOl3jd_iCgahc5H_PkR8';
    let map, autocomplete;

    function initMap() {
        map = new google.maps.Map(document.getElementById('map'), {
            center: {lat: 51.9213, lng: 6.0651}, zoom: 16, mapTypeId: 'satellite'
        });
        autocomplete = new google.maps.places.Autocomplete(document.getElementById('searchBox'), {
            types: ['address'], componentRestrictions: {country: 'nl'}
        });
        autocomplete.addListener('place_changed', onAddressSelect);
    }

    async function onAddressSelect() {
        const place = autocomplete.getPlace();
        if (!place.geometry) return;
        map.setCenter(place.geometry.location);
        map.setZoom(20);
        
        const lat = place.geometry.location.lat();
        const lng = place.geometry.location.lng();
        
        const status = document.getElementById('api-status');
        status.innerHTML = "📡 Bezig met live dak-scan...";

        try {
            // Dit is de directe aanroep naar de Solar API
            const response = await fetch(`https://solar.googleapis.com/v1/buildingInsights:findClosest?location.latitude=${lat}&location.longitude=${lng}&key=${API_KEY}`);
            const data = await response.json();

            if (data.solarPotential) {
                const panels = data.solarPotential.maxArrayPanels;
                document.getElementById('p_count').value = panels;
                status.innerHTML = `<span style="color:green">✔ ${panels} panelen gedetecteerd.</span>`;
            } else {
                status.innerHTML = "<span style='color:orange'>⚠ Geen 3D-data voor dit pand. Voer handmatig in.</span>";
            }
        } catch (error) {
            status.innerHTML = "<span style='color:red'>❌ API Blokkade: Controleer 'API Restrictions' in Console.</span>";
        }
    }

    function calculate() {
        const panels = parseInt(document.getElementById('p_count').value) || 0;
        const usage = parseInt(document.getElementById('u_annual').value) || 0;
        
        // Berekening: Pandverbruik + Mobiliteitsfactor
        let battery = ((usage / 365) * 0.70) + (panels * 0.45);
        let finalSize = Math.max(2.5, Math.round(battery / 2.5) * 2.5);

        document.getElementById('results').style.display = 'block';
        document.getElementById('r_bat').innerText = finalSize.toFixed(1) + " kWh";
        document.getElementById('r_text').innerText = `Geadviseerd ChargePoint systeem op basis van een geschat vermogen van ${(panels * 0.435).toFixed(1)} kWp.`;
    }

    window.onload = initMap;
</script>
</body>
</html>
