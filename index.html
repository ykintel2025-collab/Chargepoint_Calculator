<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChargePoint Sales Pro | Batterij & PV Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cp-magenta: #e6007e;
            --cp-dark: #333333;
            --cp-border: #e0e0e0;
            --cp-gray-bg: #f8f8f8;
            --cp-white: #ffffff;
        }

        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; color: var(--cp-dark); margin: 0; padding: 20px; }
        .wrapper { max-width: 900px; margin: 0 auto; background: var(--cp-white); box-shadow: 0 10px 40px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
        
        .header { padding: 30px 40px; border-bottom: 2px solid var(--cp-magenta); display: flex; justify-content: space-between; align-items: center; }
        .logo { max-height: 45px; }
        .tool-name { font-weight: 800; font-size: 14px; text-transform: uppercase; color: var(--cp-magenta); letter-spacing: 1px; }

        .content { padding: 40px; }
        h2 { font-size: 20px; border-left: 4px solid var(--cp-magenta); padding-left: 15px; margin-bottom: 25px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .full-width { grid-column: span 2; }

        .card { background: var(--cp-gray-bg); padding: 20px; border-radius: 6px; border: 1px solid var(--cp-border); }
        label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; color: #666; }
        
        input, select { width: 100%; padding: 12px; border: 1px solid var(--cp-border); border-radius: 4px; font-size: 15px; box-sizing: border-box; }
        input:focus { border-color: var(--cp-magenta); outline: none; }

        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; cursor: pointer; }
        .checkbox-group input { width: 18px; height: 18px; accent-color: var(--cp-magenta); }

        .btn-main { background: var(--cp-magenta); color: white; border: none; padding: 20px; width: 100%; font-size: 16px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
        .btn-main:hover { background: #c7006e; transform: translateY(-2px); }

        #result-box { display: none; margin-top: 30px; padding: 30px; background: var(--cp-dark); color: white; border-radius: 6px; }
        .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; border-top: 1px solid #444; pt: 20px; margin-top: 20px;}
        .highlight { color: var(--cp-magenta); font-size: 24px; font-weight: 800; }
        
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <img src="Chargepoint_logo.png" alt="ChargePoint" class="logo">
        <div class="tool-name">Sales Professional Tool</div>
    </div>

    <div class="content">
        <h2>1. Klant & Locatie</h2>
        <div class="grid">
            <div class="full-width">
                <label>Adres van de klant</label>
                <input type="text" id="adres" placeholder="Straat, Huisnummer, Woonplaats">
            </div>
            <div>
                <label>Klantnaam</label>
                <input type="text" id="klantnaam" placeholder="Naam contactpersoon">
            </div>
            <div>
                <label>Type Woning</label>
                <select id="woning_type" onchange="schatDakoppervlak()">
                    <option value="tussen">Tussenwoning</option>
                    <option value="hoek">Hoek / 2-onder-1-kap</option>
                    <option value="vrijstaand">Vrijstaand</option>
                    <option value="bedrijf">Bedrijfspand / Plat dak</option>
                </select>
            </div>
        </div>

        <h2>2. Energieverbruik</h2>
        <div class="grid">
            <div>
                <label>Jaarverbruik (kWh)</label>
                <input type="number" id="usage" value="3500">
                <small style="font-size: 10px; color: #888;">Niet bekend? Gebruik 1500 per bewoner.</small>
            </div>
            <div>
                <label>Aantal bewoners</label>
                <select id="ppl" onchange="autoSchatVerbruik()">
                    <option value="0">Maak keuze...</option>
                    <option value="1">1 Persoon</option>
                    <option value="2">2 Personen</option>
                    <option value="4">3-4 Personen</option>
                    <option value="6">5+ Personen</option>
                </select>
            </div>
        </div>

        <h2>3. Zonnepanelen (PV)</h2>
        <div class="card">
            <div class="grid" style="margin-bottom: 0;">
                <div>
                    <label>Huidige status PV</label>
                    <select id="pv_status" onchange="togglePVSection()">
                        <option value="ja">Reeds aanwezig</option>
                        <option value="nee">Nog niet aanwezig</option>
                    </select>
                </div>
                <div id="pv_input_box">
                    <label>Huidig Vermogen (kWp)</label>
                    <input type="number" id="pv_kw" value="4.5">
                </div>
            </div>
            <div id="pv_inschatting" style="display: none; margin-top: 20px; color: var(--cp-magenta); font-weight: 600;">
                <span id="dak_tekst"></span>
            </div>
        </div>

        <h2 style="margin-top:30px;">4. Grote Verbruikers</h2>
        <div class="grid">
            <label class="checkbox-group"><input type="checkbox" id="ev"> Elektrische Auto (Laden @ home)</label>
            <label class="checkbox-group"><input type="checkbox" id="wp"> Warmtepomp Installatie</label>
        </div>

        <button class="btn-main" onclick="generateAdvice()">Genereer Pro Advies</button>

        <div id="result-box">
            <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--cp-magenta);">Advies Rapport</div>
            <h3 id="res_titel" style="margin: 10px 0;"></h3>
            
            <div class="res-grid">
                <div>
                    <label style="color: #aaa;">Batterij Opslag</label>
                    <div class="highlight" id="out_bat">-- kWh</div>
                </div>
                <div>
                    <label style="color: #aaa;">PV Potentieel</label>
                    <div class="highlight" id="out_pv">-- kWp</div>
                </div>
            </div>
            
            <p id="out_advies" style="margin-top: 20px; font-size: 14px; line-height: 1.6; color: #ddd;"></p>
            
            <div style="margin-top: 20px; padding: 15px; background: #444; border-radius: 4px; font-size: 12px; color: #fff;">
                <strong>Sales Note:</strong> Dit advies is gebaseerd op een modulaire opbouw. Bespreek bij de klant de mogelijkheid voor fase-opslag.
            </div>
        </div>
    </div>
</div>

<script>
    function autoSchatVerbruik() {
        const ppl = document.getElementById('ppl').value;
        if(ppl > 0) {
            document.getElementById('usage').value = ppl * 1600;
        }
    }

    function togglePVSection() {
        const status = document.getElementById('pv_status').value;
        document.getElementById('pv_input_box').style.display = (status === 'ja') ? 'block' : 'none';
        document.getElementById('pv_inschatting').style.display = (status === 'nee') ? 'block' : 'none';
        if(status === 'nee') schatDakoppervlak();
    }

    function schatDakoppervlak() {
        const type = document.getElementById('woning_type').value;
        let maxPanelen = 0;
        if(type === 'tussen') maxPanelen = 10;
        if(type === 'hoek') maxPanelen = 16;
        if(type === 'vrijstaand') maxPanelen = 30;
        if(type === 'bedrijf') maxPanelen = 60;

        document.getElementById('dak_tekst').innerText = `Geschat potentieel op dit dak: ca. ${maxPanelen} panelen (± ${maxPanelen * 0.43} kWp).`;
        return maxPanelen * 0.43;
    }

    function generateAdvice() {
        const klant = document.getElementById('klantnaam').value || "Klant";
        const usage = parseFloat(document.getElementById('usage').value);
        const hasPV = document.getElementById('pv_status').value === 'ja';
        const curPV = parseFloat(document.getElementById('pv_kw').value);
        const ev = document.getElementById('ev').checked;
        const wp = document.getElementById('wp').checked;

        // Batterij Logica
        let factor = 0.65 + (ev ? 0.15 : 0) + (wp ? 0.20 : 0);
        let batCap = (usage / 365) * factor;

        // PV Potentieel
        let pvPot = hasPV ? curPV : schatDakoppervlak();

        // Limiteer batterij aan PV (sales logica: niet meer opslaan dan je redelijkerwijs opwekt)
        batCap = Math.min(batCap, pvPot * 1.8);
        batCap = Math.max(2.5, Math.round(batCap / 2.5) * 2.5);

        // UI Update
        document.getElementById('result-box').style.display = 'block';
        document.getElementById('res_titel').innerText = `Configuratie voor ${klant}`;
        document.getElementById('out_bat').innerText = batCap.toFixed(1) + " kWh";
        document.getElementById('out_pv').innerText = pvPot.toFixed(1) + " kWp";
        
        document.getElementById('out_advies').innerText = `Voor het adres ${document.getElementById('adres').value || 'Locatie onbekend'} adviseren wij een systeem van ${batCap.toFixed(1)} kWh. Hiermee dekken we de nachtlast inclusief ${ev ? 'EV-lading' : ''} ${wp ? 'en warmtepomp' : ''}. ${!hasPV ? 'Er is ruimte voor een PV-installatie van ca. ' + pvPot.toFixed(1) + ' kWp om de batterij optimaal te benutten.' : ''}`;
        
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
