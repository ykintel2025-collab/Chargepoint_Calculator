<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChargePoint Sales Pro | Infra Analyst</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAHsZid6T-w8cpmOl3jd_iCgahc5H_PkR8&libraries=places"></script>
    <style>
        :root { --cp-magenta: #e6007e; --cp-dark: #1a1a1a; --cp-border: #d1d5db; }
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; margin: 0; padding: 15px; color: var(--cp-dark); }
        .wrapper { max-width: 1250px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 20px 40px; border-bottom: 4px solid var(--cp-magenta); display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .logo { max-height: 45px; }
        .main-container { display: grid; grid-template-columns: 1fr 550px; min-height: 750px; }
        .form-content { padding: 30px 40px; border-right: 1px solid #eee; overflow-y: auto; height: 750px; }
        .map-side { position: relative; background: #ddd; display: flex; flex-direction: column; }
        #map { flex-grow: 1; width: 100%; }
        .map-overlay-logo { position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(255,255,255,0.95); padding: 12px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-left: 4px solid var(--cp-magenta); }
        h2 { font-size: 11px; text-transform: uppercase; color: var(--cp-magenta); margin: 25px 0 15px 0; border-bottom: 1px solid #eee; padding-bottom: 8px; font-weight: 800; letter-spacing: 1px; }
        .f-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; color: #666; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--cp-border); border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        .btn-calc { background: var(--cp-magenta); color: white; border: none; padding: 20px; width: 100%; font-size: 16px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-top: 30px; border-radius: 8px; transition: 0.3s; }
        #results { display: none; padding: 40px; background: var(--cp-dark); color: white; border-top: 6px solid var(--cp-magenta); }
        .val { font-size: 42px; font-weight: 800; color: var(--cp-magenta); }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <img src="Chargepoint_logo.png" alt="ChargePoint" class="logo">
        <div style="text-align:right;"><span style="font-weight:800; color:var(--cp-magenta);">ENERGY INFRA ANALYST 5.4</span></div>
    </div>

    <div class="main-container">
        <div class="form-content">
            <h2>1. Project Locatie</h2>
            <label>Adres Zoeken</label>
            <input type="text" id="searchBox" placeholder="Voer adres in voor analyse...">
            <span id="api-status" style="font-size:11px; color:#888; margin-top:4px; display:block;"></span>

            <h2>2. Mobiliteit & Laadbehoefte</h2>
            <div class="f-grid">
                <div><label>Nieuwe Laders</label><input type="number" id="ev_count" value="1"></div>
                <div><label>Behoefte (kWh/dag)</label><input type="number" id="ev_kwh" value="25"></div>
            </div>

            <h2>3. Energieverbruik Pand</h2>
            <div class="f-grid">
                <div><label>Jaarverbruik (kWh)</label><input type="number" id="u_annual" value="4500"></div>
                <div><label>Aansluiting</label><select id="u_phase"><option value="3">3-Fase</option><option value="1">1-Fase</option></select></div>
            </div>

            <h2>4. Solar Potentieel (Satelliet Data)</h2>
            <div class="f-grid">
                <div><label>Aantal Panelen</label><input type="number" id="p_count" value="0" oninput="upd()"></div>
                <div><label>Wp per paneel</label><input type="number" id="p_wp" value="435" oninput="upd()"></div>
                <div style="grid-column: span 2;"><label>Totaal Vermogen (kWp)</label><input type="text" id="p_total" value="0.00 kWp" readonly style="background:#f9fafb; font-weight:700;"></div>
            </div>

            <button class="btn-calc" onclick="calculate()">Start Systeem Berekening</button>
        </div>

        <div class="map-side">
            <div id="hq-label" class="map-overlay-logo">
                <img src="Chargepoint_logo.png" alt="CP" style="height:25px; vertical-align:middle;">
                <span style="font-weight:800; margin-left:8px; color:#333; font-size:11px;">HOOFDKANTOOR ZEVENAAR</span>
            </div>
            <div id="map"></div>
        </div>
    </div>

    <div id="results">
        <div class="f-grid">
            <div><label style="color:#aaa;">Geadviseerde Batterij</label><div class="val" id="r_bat">-- kWh</div></div>
            <div><label style="color:#aaa;">Autarkie</label><div class="val" id="r_aut">-- %</div></div>
        </div>
        <p id="r_text" style="margin-top:25px; color:#ddd; line-height:1.6; font-size:15px; border-top:1px solid #444; padding-top:20px;"></p>
    </div>
</div>

<script>
    const API_KEY = 'AIzaSyAHsZid6T-w8cpmOl3jd_iCgahc5H_PkR8';
    let gMap, gMarker, gHQMarker, gAutocomplete;

    function initMap() {
        const cpLoc = { lat: 51.9213, lng: 6.0651 };
        gMap = new google.maps.Map(document.getElementById('map'), {
            center: cpLoc, zoom: 16, mapTypeId: 'satellite', tilt: 0
        });
        gHQMarker = new google.maps.Marker({ position: cpLoc, map: gMap, title: "ChargePoint HQ" });
        gAutocomplete = new google.maps.places.Autocomplete(document.getElementById('searchBox'), {
            types: ['address'], componentRestrictions: {country: 'nl'}
        });
        gAutocomplete.addListener('place_changed', onPlaceChanged);
    }

    async function onPlaceChanged() {
        const place = gAutocomplete.getPlace();
        if (!place.geometry) return;

        // Verwijder HQ marker en label direct
        if (gHQMarker) { gHQMarker.setMap(null); gHQMarker = null; }
        document.getElementById('hq-label').style.display = 'none';

        gMap.setCenter(place.geometry.location);
        gMap.setZoom(20);
        if (gMarker) gMarker.setMap(null);
        gMarker = new google.maps.Marker({ position: place.geometry.location, map: gMap });
        
        fetchSolarData(place.geometry.location.lat(), place.geometry.location.lng());
    }

    async function fetchSolarData(lat, lng) {
        const status = document.getElementById('api-status');
        status.innerText = "📡 Bezig met live satelliet-scan...";
        try {
            const r = await fetch(`https://solar.googleapis.com/v1/buildingInsights:findClosest?location.latitude=${lat}&location.longitude=${lng}&key=${API_KEY}`);
            const d = await r.json();
            
            if (d && d.solarPotential && d.solarPotential.maxArrayPanels) {
                const count = d.solarPotential.maxArrayPanels;
                document.getElementById('p_count').value = count;
                status.innerHTML = `<span style="color:green">✔ ${count} panelen gedetecteerd via satelliet.</span>`;
            } else {
                document.getElementById('p_count').value = 0;
                status.innerHTML = "<span style='color:orange'>⚠ Geen 3D-data voor dit pand. Vul panelen handmatig in.</span>";
            }
            upd();
        } catch (e) {
            status.innerHTML = "<span style='color:red'>❌ Connectiefout. Controleer API Restrictions in Google Console.</span>";
        }
    }

    function upd() {
        const c = parseInt(document.getElementById('p_count').value) || 0;
        const wp = parseInt(document.getElementById('p_wp').value) || 435;
        document.getElementById('p_total').value = ((c * wp) / 1000).toFixed(2) + " kWp";
    }

    function calculate() {
        const usage = parseFloat(document.getElementById('u_annual').value) || 0;
        const evCount = parseInt(document.getElementById('ev_count').value) || 0;
        const evKwh = parseFloat(document.getElementById('ev_kwh').value) || 0;
        const pvKwp = parseFloat(document.getElementById('p_total').value) || 0;

        let battery = ((usage / 365) * 0.70) + ((evCount * evKwh) * 0.50);
        let finalSize = Math.max(2.5, Math.round(battery / 2.5) * 2.5);

        document.getElementById('results').style.display = 'block';
        document.getElementById('r_bat').innerText = finalSize.toFixed(1) + " kWh";
        document.getElementById('r_aut').innerText = "82%";
        document.getElementById('r_text').innerText = `Geadviseerd ChargePoint systeem op basis van ${pvKwp.toFixed(2)} kWp potentieel.`;
    }
    window.onload = initMap;
</script>
</body>
</html>
