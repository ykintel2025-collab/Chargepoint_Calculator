<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChargePoint Sales Pro | Google Solar Analyst</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --cp-magenta: #e6007e; --cp-dark: #333333; --cp-border: #e0e0e0; }
        body { font-family: 'Inter', sans-serif; background: #f4f7f9; margin: 0; padding: 20px; color: var(--cp-dark); }
        .wrapper { max-width: 850px; margin: 0 auto; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
        .header { padding: 25px 40px; border-bottom: 2px solid var(--cp-magenta); display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .logo { max-height: 50px; }
        .content { padding: 40px; }
        h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--cp-magenta); margin: 30px 0 20px 0; border-bottom: 1px solid #eee; padding-bottom: 10px; font-weight: 700; }
        .input-group { margin-bottom: 25px; }
        label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; color: #666; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--cp-border); border-radius: 4px; font-size: 15px; box-sizing: border-box; }
        .address-row { display: flex; gap: 10px; align-items: flex-end; }
        .btn-api { background: var(--cp-dark); color: white; border: none; padding: 13px 20px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; transition: 0.2s; }
        .btn-api:hover { background: #000; }
        .btn-main { background: var(--cp-magenta); color: white; border: none; padding: 20px; width: 100%; font-size: 16px; font-weight: 700; text-transform: uppercase; cursor: pointer; margin-top: 20px; transition: 0.2s; }
        .btn-main:hover { opacity: 0.9; }
        .btn-copy { background: #f0f0f0; color: var(--cp-dark); border: 1px solid var(--cp-border); padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; margin-top: 20px; display: none; }
        #solar-results { display: none; margin-top: 20px; padding: 20px; background: #fff4f9; border: 1px solid var(--cp-magenta); border-radius: 4px; }
        #result-box { display: none; margin-top: 30px; padding: 35px; background: var(--cp-dark); color: white; border-radius: 6px; }
        .highlight { color: var(--cp-magenta); font-size: 36px; font-weight: 800; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <img src="Chargepoint_logo.png" alt="ChargePoint" class="logo">
        <div style="font-weight:800; color:var(--cp-magenta); font-size: 12px; letter-spacing: 1px;">SALES PRO ANALYST</div>
    </div>

    <div class="content">
        <h2>1. Locatie & Dak Analyse</h2>
        <div class="input-group">
            <div class="address-row">
                <div style="flex-grow: 1;">
                    <label>Adres voor Satellietscan (Straat, Nr, Woonplaats)</label>
                    <input type="text" id="adres" placeholder="Bijv. Stationsplein 1, Utrecht">
                </div>
                <button class="btn-api" id="scanBtn" onclick="scanDak()">Scan Dak via Google</button>
            </div>
        </div>

        <div id="solar-results">
            <div style="font-weight: 800; color: var(--cp-magenta); margin-bottom: 5px; text-transform: uppercase; font-size: 11px;">Google Solar Analyse:</div>
            <div id="dak_info" style="line-height: 1.6; font-size: 14px;"></div>
        </div>

        <h2>2. Energie Profiel</h2>
        <div class="grid">
            <div class="input-group">
                <label>Jaarverbruik (kWh)</label>
                <input type="number" id="usage" value="3800">
            </div>
            <div class="input-group">
                <label>Extra Verbruikers</label>
                <div style="font-size: 13px; display: flex; gap: 20px; margin-top: 10px; font-weight: 500;">
                    <label style="text-transform:none; color:inherit; display:flex; align-items:center; gap:8px; cursor:pointer;"><input type="checkbox" id="ev" style="width:18px; height:18px; accent-color:var(--cp-magenta);"> Elektrische Auto</label>
                    <label style="text-transform:none; color:inherit; display:flex; align-items:center; gap:8px; cursor:pointer;"><input type="checkbox" id="wp" style="width:18px; height:18px; accent-color:var(--cp-magenta);"> Warmtepomp</label>
                </div>
            </div>
        </div>

        <button class="btn-main" onclick="berekenSysteem()">Genereer Systeem Advies</button>

        <div id="result-box">
            <div style="text-transform:uppercase; font-size:11px; letter-spacing: 2px; color:var(--cp-magenta); font-weight:700; margin-bottom: 20px;">Geadviseerde Configuratie</div>
            <div class="grid">
                <div>
                    <label style="color:#aaa;">Opslagcapaciteit</label>
                    <div class="highlight" id="out_bat">-- kWh</div>
                </div>
                <div>
                    <label style="color:#aaa;">PV Potentieel</label>
                    <div class="highlight" id="out_pv">-- kWp</div>
                </div>
            </div>
            <p id="advies_tekst" style="margin-top:25px; font-size:14px; line-height:1.6; color:#ccc; border-top: 1px solid #444; padding-top: 20px;"></p>
            
            <button class="btn-copy" id="copyBtn" onclick="copyToClipboard()">📋 Kopieer voor Klant</button>
        </div>
    </div>
</div>

<script>
    const GOOGLE_KEY = 'AIzaSyCurnfzpLle-DsRG1Hg4zfaHG07-xPSL4Q'; // Jouw API-key uit de console
    let maxKWp = 0;
    let numPanels = 0;

    async function scanDak() {
        const adres = document.getElementById('adres').value;
        if(!adres) return alert("Voer eerst een adres in.");
        
        const infoDiv = document.getElementById('dak_info');
        const scanBtn = document.getElementById('scanBtn');
        
        document.getElementById('solar-results').style.display = 'block';
        infoDiv.innerText = "Satellietdata analyseren...";
        scanBtn.disabled = true;

        try {
            // Stap 1: Geocoding (Adres naar Coördinaten)
            const gRes = await fetch(`https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(adres)}&key=${GOOGLE_KEY}`);
            const gData = await gRes.json();
            
            if (gData.status !== "OK") throw new Error("Adres niet gevonden door Google.");
            const loc = gData.results[0].geometry.location;

            // Stap 2: Solar API (Coördinaten naar Dakdata)
            const sRes = await fetch(`https://solar.googleapis.com/v1/buildingInsights:findClosest?location.latitude=${loc.lat}&location.longitude=${loc.lng}&key=${GOOGLE_KEY}`);
            const sData = await sRes.json();

            if (!sData.solarPotential) throw new Error("Geen solar data beschikbaar voor dit pand.");

            numPanels = sData.solarPotential.maxArrayPanels;
            maxKWp = numPanels * 0.435; // 435Wp per paneel gemiddeld

            infoDiv.innerHTML = `
                Dit dak heeft ruimte voor maximaal <b>${numPanels} panelen</b>.<br>
                Dit resulteert in een maximaal PV-vermogen van <b>${maxKWp.toFixed(1)} kWp</b>.
            `;
        } catch (e) {
            infoDiv.innerHTML = `<span style="color:red;">Fout: ${e.message}</span>`;
        } finally {
            scanBtn.disabled = false;
        }
    }

    function berekenSysteem() {
        const usage = parseFloat(document.getElementById('usage').value);
        const ev = document.getElementById('ev').checked;
        const wp = document.getElementById('wp').checked;

        let factor = 0.65 + (ev ? 0.12 : 0) + (wp ? 0.18 : 0);
        let cap = (usage / 365) * factor;

        if(maxKWp > 0) cap = Math.min(cap, maxKWp * 1.6);
        cap = Math.max(2.5, Math.round(cap / 2.5) * 2.5);

        document.getElementById('result-box').style.display = 'block';
        document.getElementById('copyBtn').style.display = 'block';
        document.getElementById('out_bat').innerText = cap.toFixed(1) + " kWh";
        document.getElementById('out_pv').innerText = maxKWp > 0 ? maxKWp.toFixed(1) + " kWp" : "N.v.t.";
        document.getElementById('advies_tekst').innerText = `Op basis van de dakanalyse en het verbruiksprofiel adviseren wij een modulair ChargePoint opslagsysteem van ${cap.toFixed(1)} kWh.`;
        
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function copyToClipboard() {
        const adres = document.getElementById('adres').value;
        const bat = document.getElementById('out_bat').innerText;
        const pv = document.getElementById('out_pv').innerText;
        const usage = document.getElementById('usage').value;
        
        const tekst = `CHARGEPOINT ENERGIE ADVIES\n--------------------------\nLocatie: ${adres}\nJaarverbruik: ${usage} kWh\n\nGoogle Dak-Analyse: ${numPanels} panelen mogelijk (${pv})\nGeadviseerde Batterij: ${bat}\n--------------------------\nGenereer uw offerte op www.chargepointeurope.com`;
        
        navigator.clipboard.writeText(tekst).then(() => {
            alert("Advies gekopieerd naar klembord!");
        });
    }
</script>

</body>
</html>
